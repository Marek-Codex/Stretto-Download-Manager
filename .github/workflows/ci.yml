name: Build and regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build Windows x64
        run: dotnet build Stretto.slnx -c Release -p:Platform=x64 --disable-build-servers
      - name: Engine regressions
        run: dotnet run --project Stretto.Tests -c Release --no-build
      - name: Browser capture regressions
        run: node tools/capture-test.js
      - name: Media detection regressions
        run: node tools/media-test.js
      - name: Companion popup regressions
        run: node tools/popup-test.js
      - name: Naming and handoff acceptance regressions
        run: node extensions/naming-check.js
